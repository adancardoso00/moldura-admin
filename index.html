<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MolduraSaaS — Painel do Operador</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Config injetada pelo servidor (nunca commitar secrets aqui) -->
  <script src="/config.js"></script>
  <style>
    body { font-family: system-ui, sans-serif; background: #0f172a; color: #e2e8f0; }
    .card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; }
    .badge { display: inline-flex; align-items: center; padding: 2px 10px; border-radius: 999px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; }
    .order-card { background: #0f172a; border: 1px solid #334155; border-radius: 8px; cursor: pointer; transition: border-color 0.15s; }
    .order-card:hover { border-color: #6366f1; }
    .status-select { background: #1e293b; border: 1px solid #475569; color: #e2e8f0; border-radius: 6px; padding: 4px 8px; font-size: 12px; cursor: pointer; }
    .tab-btn { padding: 8px 20px; border-radius: 8px; font-size: 14px; font-weight: 500; cursor: pointer; transition: all 0.15s; }
    .tab-btn.active { background: #6366f1; color: white; }
    .tab-btn:not(.active) { color: #94a3b8; }
    .tab-btn:not(.active):hover { background: #1e293b; color: #e2e8f0; }
    input, select { background: #1e293b; border: 1px solid #475569; color: #e2e8f0; border-radius: 8px; padding: 8px 12px; outline: none; }
    input:focus, select:focus { border-color: #6366f1; }
    .spinner { width: 24px; height: 24px; border: 2px solid #334155; border-top-color: #6366f1; border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 50; align-items: center; justify-content: center; }
    .modal.open { display: flex; }
    .toast { position: fixed; bottom: 24px; right: 24px; background: #22c55e; color: white; padding: 10px 20px; border-radius: 8px; font-size: 14px; z-index: 100; opacity: 0; transition: opacity 0.3s; }
    .toast.show { opacity: 1; }
  </style>
</head>
<body class="min-h-screen">

<div id="toast" class="toast"></div>

<header class="border-b border-slate-800 px-6 py-4 flex items-center justify-between sticky top-0 z-10" style="background:#0f172a">
  <div class="flex items-center gap-3">
    <div class="w-8 h-8 rounded-lg bg-indigo-600 flex items-center justify-center text-white font-bold text-sm">M</div>
    <div>
      <h1 class="font-bold text-white text-lg leading-none">MolduraSaaS</h1>
      <p class="text-xs text-slate-500 mt-0.5">Painel do Operador</p>
    </div>
  </div>
  <div class="flex items-center gap-3">
    <select id="tenant-select" class="text-sm" onchange="changeTenant(this.value)"><option value="">Carregando...</option></select>
    <button onclick="refreshAll()" id="refresh-btn" class="text-slate-400 hover:text-white p-2 rounded-lg hover:bg-slate-800" title="Atualizar">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"></polyline><path d="M3.51 15a9 9 0 1 0 .49-3.51"></path></svg>
    </button>
  </div>
</header>

<div class="px-6 pt-4 flex gap-2 flex-wrap">
  <button class="tab-btn active" onclick="switchTab('overview',this)">📊 Visão Geral</button>
  <button class="tab-btn" onclick="switchTab('kanban',this)">🗂️ Kanban</button>
  <button class="tab-btn" onclick="switchTab('orders',this)">📋 Pedidos</button>
  <button class="tab-btn" onclick="switchTab('frames',this)">🖼️ Molduras</button>
</div>

<main class="px-6 py-6">
  <div id="tab-overview">
    <div id="metrics-grid" class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
      <div class="card p-5 flex items-center justify-center col-span-4"><div class="spinner"></div></div>
    </div>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <div class="card p-5"><h3 class="text-sm font-semibold text-slate-400 mb-4">Pedidos por Status</h3><div id="status-chart"></div></div>
      <div class="card p-5"><h3 class="text-sm font-semibold text-slate-400 mb-4">Últimos Pedidos</h3><div id="recent-orders"></div></div>
    </div>
  </div>
  <div id="tab-kanban" class="hidden"><div id="kanban-board" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-3"></div></div>
  <div id="tab-orders" class="hidden">
    <div class="flex gap-3 mb-4 flex-wrap">
      <input type="text" id="search-input" placeholder="🔍 Buscar cliente ou telefone..." class="flex-1 min-w-48 text-sm" oninput="filterOrders()" />
      <select id="status-filter" class="text-sm" onchange="filterOrders()">
        <option value="">Todos os status</option>
        <option value="pendente">Pendente</option><option value="pago">Pago</option>
        <option value="em_producao">Em Produção</option><option value="pronto">Pronto</option>
        <option value="entregue">Entregue</option><option value="cancelado">Cancelado</option>
      </select>
    </div>
    <div id="orders-table" class="card overflow-x-auto"></div>
  </div>
  <div id="tab-frames" class="hidden"><div id="frames-grid" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-4"></div></div>
</main>

<div id="order-modal" class="modal" onclick="if(event.target===this)closeModal()">
  <div class="card w-full max-w-lg mx-4 p-6 max-h-[90vh] overflow-y-auto" onclick="event.stopPropagation()">
    <div class="flex justify-between items-start mb-4">
      <h2 class="font-bold text-white text-lg">Detalhe do Pedido</h2>
      <button onclick="closeModal()" class="text-slate-400 hover:text-white text-xl leading-none">✕</button>
    </div>
    <div id="modal-content"></div>
  </div>
</div>

<script>
// Credenciais injetadas via /config.js (gerado pelo entrypoint.sh a partir de env vars)
const SB_URL = window.APP_CONFIG?.SB_URL || '';
const SB_ANON = window.APP_CONFIG?.SB_ANON || '';
const SERVICE_KEY = window.APP_CONFIG?.SERVICE_KEY || '';

let currentTenantId = '', allOrders = [];

const STATUS_CONFIG = {
  pendente:    { label:'Pendente',    color:'bg-yellow-500/20 text-yellow-400', dot:'#eab308' },
  pago:        { label:'Pago',        color:'bg-green-500/20 text-green-400',   dot:'#22c55e' },
  em_producao: { label:'Em Produção', color:'bg-blue-500/20 text-blue-400',     dot:'#3b82f6' },
  pronto:      { label:'Pronto',      color:'bg-purple-500/20 text-purple-400', dot:'#a855f7' },
  entregue:    { label:'Entregue',    color:'bg-slate-500/20 text-slate-400',   dot:'#64748b' },
  cancelado:   { label:'Cancelado',   color:'bg-red-500/20 text-red-400',       dot:'#ef4444' },
};
const STATUSES = ['pendente','pago','em_producao','pronto','entregue','cancelado'];

async function sb(endpoint, options={}) {
  const isWrite = options.method && options.method!=='GET';
  const key = isWrite ? SERVICE_KEY : SB_ANON;
  const res = await fetch(`${SB_URL}/rest/v1/${endpoint}`, {
    ...options,
    headers: { 'apikey':key, 'Authorization':`Bearer ${key}`, 'Content-Type':'application/json', 'Prefer':'return=representation', ...(options.headers||{}) },
  });
  if (!res.ok) throw new Error(await res.text());
  const text = await res.text();
  return text ? JSON.parse(text) : [];
}

const fmtCurrency = v => new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(v||0);
const fmtDate = iso => iso ? new Date(iso).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',year:'2-digit',hour:'2-digit',minute:'2-digit'}) : '—';
const statusBadge = s => { const c=STATUS_CONFIG[s]||{label:s,color:'bg-slate-500/20 text-slate-400'}; return `<span class="badge ${c.color}">${c.label}</span>`; };
function showToast(msg) { const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2500); }

async function init() { await loadTenants(); await refreshAll(); }

async function loadTenants() {
  const tenants = await sb('tenants?select=id,nome&order=nome.asc');
  document.getElementById('tenant-select').innerHTML = tenants.map(t=>`<option value="${t.id}">${t.nome}</option>`).join('');
  if (tenants.length) currentTenantId = tenants[0].id;
}

function changeTenant(id) { currentTenantId=id; refreshAll(); }

async function refreshAll() {
  const btn=document.getElementById('refresh-btn');
  btn.innerHTML='<div class="spinner" style="width:16px;height:16px;border-width:2px;"></div>';
  await Promise.all([loadMetrics(),loadOrders()]);
  btn.innerHTML='<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"></polyline><path d="M3.51 15a9 9 0 1 0 .49-3.51"></path></svg>';
}

async function loadMetrics() {
  const orders = await sb(`orders?select=status,preco,created_at&tenant_id=eq.${currentTenantId}`);
  const today=new Date().toISOString().split('T')[0];
  const counts={}; let total=0,paid=0,todayN=0;
  for (const o of orders) {
    counts[o.status]=(counts[o.status]||0)+1;
    total+=parseFloat(o.preco||0);
    if(['pago','em_producao','pronto','entregue'].includes(o.status)) paid+=parseFloat(o.preco||0);
    if((o.created_at||'').startsWith(today)) todayN++;
  }
  document.getElementById('metrics-grid').innerHTML=`
    <div class="card p-5"><p class="text-xs text-slate-400 mb-1">Total de Pedidos</p><p class="text-3xl font-bold text-white">${orders.length}</p></div>
    <div class="card p-5"><p class="text-xs text-slate-400 mb-1">Pedidos Hoje</p><p class="text-3xl font-bold text-indigo-400">${todayN}</p></div>
    <div class="card p-5"><p class="text-xs text-slate-400 mb-1">Faturamento Total</p><p class="text-3xl font-bold text-green-400">${fmtCurrency(total)}</p></div>
    <div class="card p-5"><p class="text-xs text-slate-400 mb-1">Receita Confirmada</p><p class="text-3xl font-bold text-blue-400">${fmtCurrency(paid)}</p></div>`;
  document.getElementById('status-chart').innerHTML=STATUSES.map(s=>{
    const n=counts[s]||0,pct=Math.round((n/(orders.length||1))*100),cfg=STATUS_CONFIG[s];
    return `<div class="mb-3"><div class="flex justify-between text-xs mb-1"><span class="text-slate-300">${cfg.label}</span><span class="text-slate-400">${n} (${pct}%)</span></div><div class="h-2 bg-slate-700 rounded-full overflow-hidden"><div class="h-full rounded-full" style="width:${pct}%;background:${cfg.dot}"></div></div></div>`;
  }).join('');
}

async function loadOrders() {
  allOrders=await sb(`orders?select=*,frames(nome,codigo_fornecedor,foto_url)&tenant_id=eq.${currentTenantId}&order=created_at.desc`);
  renderRecentOrders(); renderOrdersTable(allOrders); renderKanban();
}

function renderRecentOrders() {
  document.getElementById('recent-orders').innerHTML=allOrders.slice(0,5).map(o=>`
    <div class="flex items-center justify-between py-2 border-b border-slate-700 last:border-0 cursor-pointer hover:bg-slate-800/50 px-2 rounded-lg" onclick="openOrderModal('${o.id}')">
      <div><p class="text-sm font-medium text-white">${o.cliente_nome||'—'}</p><p class="text-xs text-slate-400">${fmtDate(o.created_at)}</p></div>
      <div class="text-right">${statusBadge(o.status)}<p class="text-xs text-green-400 mt-1">${fmtCurrency(o.preco)}</p></div>
    </div>`).join('')||'<p class="text-slate-500 text-sm">Nenhum pedido</p>';
}

function filterOrders() {
  const q=document.getElementById('search-input').value.toLowerCase();
  const s=document.getElementById('status-filter').value;
  renderOrdersTable(allOrders.filter(o=>(!q||(o.cliente_nome||'').toLowerCase().includes(q)||(o.phone||'').includes(q))&&(!s||o.status===s)));
}

function renderOrdersTable(orders) {
  if (!orders.length) { document.getElementById('orders-table').innerHTML='<p class="text-slate-500 text-center py-8 text-sm">Nenhum pedido encontrado</p>'; return; }
  document.getElementById('orders-table').innerHTML=`<table class="w-full text-sm">
    <thead><tr class="border-b border-slate-700 text-xs text-slate-400">
      <th class="text-left p-3">Cliente</th><th class="text-left p-3 hidden md:table-cell">Dimensões</th>
      <th class="text-left p-3 hidden md:table-cell">Tipo</th><th class="text-left p-3">Valor</th>
      <th class="text-left p-3">Status</th><th class="text-left p-3 hidden lg:table-cell">Data</th><th class="text-left p-3">Alterar</th>
    </tr></thead>
    <tbody>${orders.map(o=>`
      <tr class="border-b border-slate-700/50 hover:bg-slate-800/30 cursor-pointer" onclick="openOrderModal('${o.id}')">
        <td class="p-3"><p class="font-medium text-white">${o.cliente_nome||'—'}</p><p class="text-xs text-slate-400">${o.phone||''}</p></td>
        <td class="p-3 text-slate-300 hidden md:table-cell">${o.largura_cm}×${o.altura_cm} cm</td>
        <td class="p-3 text-slate-300 hidden md:table-cell">${o.tipo_obra||'—'}</td>
        <td class="p-3 text-green-400 font-medium">${fmtCurrency(o.preco)}</td>
        <td class="p-3">${statusBadge(o.status)}</td>
        <td class="p-3 text-slate-400 hidden lg:table-cell">${fmtDate(o.created_at)}</td>
        <td class="p-3" onclick="event.stopPropagation()">
          <select class="status-select" onchange="updateStatus('${o.id}',this.value)">
            ${STATUSES.map(s=>`<option value="${s}" ${s===o.status?'selected':''}>${STATUS_CONFIG[s].label}</option>`).join('')}
          </select>
        </td>
      </tr>`).join('')}
    </tbody></table>`;
}

function renderKanban() {
  document.getElementById('kanban-board').innerHTML=STATUSES.map(status=>{
    const items=allOrders.filter(o=>o.status===status),cfg=STATUS_CONFIG[status];
    return `<div>
      <div class="flex items-center gap-2 mb-3">
        <div class="w-2 h-2 rounded-full" style="background:${cfg.dot}"></div>
        <span class="text-xs font-semibold text-slate-400 uppercase tracking-wide">${cfg.label}</span>
        <span class="ml-auto text-xs bg-slate-700 text-slate-300 px-2 py-0.5 rounded-full">${items.length}</span>
      </div>
      <div class="space-y-2 min-h-[100px]">
        ${items.length?items.map(o=>`
          <div class="order-card p-3" onclick="openOrderModal('${o.id}')">
            <p class="text-sm font-medium text-white mb-1">${o.cliente_nome||'Cliente'}</p>
            <p class="text-xs text-slate-400 mb-2">${o.largura_cm}×${o.altura_cm} cm · ${o.tipo_obra||''}</p>
            <div class="flex justify-between items-center">
              <span class="text-xs text-green-400 font-medium">${fmtCurrency(o.preco)}</span>
              <span class="text-xs text-slate-500">${fmtDate(o.created_at).split(',')[0]}</span>
            </div>
          </div>`).join(''):'<p class="text-xs text-slate-600 text-center py-4 border border-dashed border-slate-700 rounded-lg">Nenhum</p>'}
      </div>
    </div>`;
  }).join('');
}

async function loadFrames() {
  const frames=await sb(`frames?select=*&tenant_id=eq.${currentTenantId}&order=nome.asc`);
  document.getElementById('frames-grid').innerHTML=frames.length
    ?frames.map(f=>`<div class="card p-3 text-center">
        ${f.foto_url?`<img src="${f.foto_url}" class="w-full h-20 object-cover rounded-lg mb-2"/>`:'<div class="w-full h-20 bg-slate-700 rounded-lg mb-2 flex items-center justify-center text-slate-500 text-2xl">🖼️</div>'}
        <p class="text-xs font-medium text-white">${f.nome}</p>
        <p class="text-xs text-slate-400">${f.codigo_fornecedor||''}</p>
        <p class="text-xs text-green-400 mt-1">${fmtCurrency(f.preco_metro_linear)}/m</p>
      </div>`).join('')
    :'<p class="text-slate-500 col-span-6 text-sm">Nenhuma moldura</p>';
}

function openOrderModal(id) {
  const o=allOrders.find(x=>x.id===id); if(!o) return;
  const extras=o.extras_selecionados||[],frame=o.frames;
  document.getElementById('modal-content').innerHTML=`<div class="space-y-4">
    <div class="grid grid-cols-2 gap-3 text-sm">
      <div><p class="text-xs text-slate-400">Cliente</p><p class="text-white font-medium">${o.cliente_nome||'—'}</p></div>
      <div><p class="text-xs text-slate-400">Telefone</p><a href="https://wa.me/${o.phone}" target="_blank" class="text-green-400 hover:underline">${o.phone||'—'}</a></div>
      <div><p class="text-xs text-slate-400">Dimensões</p><p class="text-white">${o.largura_cm} × ${o.altura_cm} cm</p></div>
      <div><p class="text-xs text-slate-400">Tipo de Obra</p><p class="text-white">${o.tipo_obra||'—'}</p></div>
      ${frame?`<div class="col-span-2"><p class="text-xs text-slate-400">Moldura</p><p class="text-white">${frame.nome||''} ${frame.codigo_fornecedor?`(${frame.codigo_fornecedor})`:''}</p></div>`:''}
      <div><p class="text-xs text-slate-400">Preço Perfil</p><p class="text-green-400">${fmtCurrency(o.preco_perfil)}</p></div>
      <div><p class="text-xs text-slate-400">Preço Extras</p><p class="text-green-400">${fmtCurrency(o.preco_extras)}</p></div>
      <div><p class="text-xs text-slate-400">Total</p><p class="text-green-400 text-lg font-bold">${fmtCurrency(o.preco)}</p></div>
      <div><p class="text-xs text-slate-400">Status</p>${statusBadge(o.status)}</div>
      <div><p class="text-xs text-slate-400">Criado em</p><p class="text-slate-300">${fmtDate(o.created_at)}</p></div>
      <div><p class="text-xs text-slate-400">Pago em</p><p class="text-slate-300">${fmtDate(o.pago_em)}</p></div>
    </div>
    ${extras.length?`<div><p class="text-xs text-slate-400 mb-2">Extras</p><div class="flex gap-2 flex-wrap">${extras.map(e=>`<span class="badge bg-indigo-500/20 text-indigo-300">${e.slug}</span>`).join('')}</div></div>`:''}
    ${o.notas?`<div><p class="text-xs text-slate-400">Notas</p><p class="text-white text-sm">${o.notas}</p></div>`:''}
    ${o.mp_payment_id?`<div><p class="text-xs text-slate-400">MP Payment ID</p><p class="text-xs font-mono text-slate-300">${o.mp_payment_id}</p></div>`:''}
    <div>
      <p class="text-xs text-slate-400 mb-2">Alterar Status</p>
      <select class="status-select w-full text-sm" onchange="updateStatus('${o.id}',this.value)">
        ${STATUSES.map(s=>`<option value="${s}" ${s===o.status?'selected':''}>${STATUS_CONFIG[s].label}</option>`).join('')}
      </select>
    </div>
  </div>`;
  document.getElementById('order-modal').classList.add('open');
}

function closeModal() { document.getElementById('order-modal').classList.remove('open'); }

async function updateStatus(orderId, newStatus) {
  await sb(`orders?id=eq.${orderId}`,{
    method:'PATCH',
    body:JSON.stringify({status:newStatus,updated_at:new Date().toISOString(),...(newStatus==='pago'?{pago_em:new Date().toISOString()}:{}),...(newStatus==='entregue'?{entregue_em:new Date().toISOString()}:{})}),
  });
  showToast('✓ Status atualizado!'); closeModal();
  await loadOrders(); await loadMetrics();
}

function switchTab(tab,btn) {
  ['overview','kanban','orders','frames'].forEach(t=>document.getElementById('tab-'+t).classList.add('hidden'));
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('tab-'+tab).classList.remove('hidden'); btn.classList.add('active');
  if(tab==='frames') loadFrames();
}

init();
</script>
</body>
</html>
