services:
  moldura-admin:
    build: .
    container_name: moldura-admin
    restart: unless-stopped
    env_file: .env
    networks:
      - traefik-public
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-public"
      - "traefik.http.routers.moldura-admin.rule=Host(`admin.adan.company`)"
      - "traefik.http.routers.moldura-admin.entrypoints=websecure"
      - "traefik.http.routers.moldura-admin.tls=true"
      - "traefik.http.routers.moldura-admin.tls.certresolver=le"
      - "traefik.http.services.moldura-admin.loadbalancer.server.port=80"

networks:
  traefik-public:
    external: true
