server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # config.js gerado em runtime — nunca cachear
    location = /config.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        expires off;
    }

    # Cache estático (demais assets)
    location ~* \.(css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Proxy reverso pra Supabase — evita CORS + extensões privacy bloqueando
    location /sb/ {
        resolver 1.1.1.1 ipv6=off valid=60s;
        proxy_pass https://__SUPABASE_HOST__/;
        proxy_set_header Host __SUPABASE_HOST__;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_ssl_server_name on;
        proxy_ssl_name __SUPABASE_HOST__;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 30s;
        proxy_connect_timeout 10s;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/javascript application/json;
    gzip_min_length 1000;
}
